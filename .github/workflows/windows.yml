# Routine Windows CI for Stage A. Fixture-based, per-user only: no UAC prompt,
# nothing outside the runner's own profile is touched.
# Status: PLANNED — written in the development container, not yet executed.
name: windows

on:
  push:
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p sweep-core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core unit + acceptance tests (Windows host)
        run: cargo test -p sweep-core
      - name: Build fixtures
        run: cargo build -p sweep-fixtures
      - name: Stage A Windows integration tests
        shell: pwsh
        run: |
          $env:SWEEP_FIXTURE = "$PWD\target\debug\sweep-fixture.exe"
          cargo test -p sweep-win --test stage_a_windows -- --ignored --test-threads=1 2>&1 | Tee-Object -FilePath stage-a-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI build + smoke tests (mocked backend)
        working-directory: ui
        run: |
          npm ci
          npm run build
          npx playwright install chromium
          npx playwright test
      - name: Build installer
        shell: pwsh
        run: |
          npm install --global @tauri-apps/cli@2
          tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-stage-a
          path: |
            stage-a-windows.log
            target/release/bundle/nsis/*.exe
